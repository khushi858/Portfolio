<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Johnson - Full Stack Developer</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .gradient-border {
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
            padding: 2px;
            border-radius: 12px;
        }
        
        .card-hover {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card-hover:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
        }
        
        .skill-bar {
            transition: width 2s ease-in-out;
        }
        
        .typewriter {
            overflow: hidden;
            border-right: 3px solid #4a5568;
            white-space: nowrap;
            animation: typing 3.5s steps(40, end), blink-caret 0.75s step-end infinite;
        }
        
        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }
        
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #4a5568 }
        }
        
        .floating {
            animation: floating 6s ease-in-out infinite;
        }
        
        @keyframes floating {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(2deg); }
            66% { transform: translateY(-10px) rotate(-1deg); }
        }
        
        .slide-in-left {
            animation: slideInLeft 0.8s ease-out;
        }
        
        .slide-in-right {
            animation: slideInRight 0.8s ease-out;
        }
        
        .fade-in {
            animation: fadeIn 1s ease-in;
        }
        
        .bounce-in {
            animation: bounceIn 0.8s ease-out;
        }
        
        .pulse-glow {
            animation: pulseGlow 2s infinite;
        }
        
        @keyframes slideInLeft {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(74, 85, 104, 0.3); }
            50% { box-shadow: 0 0 40px rgba(74, 85, 104, 0.5); }
        }
        
        .scroll-smooth {
            scroll-behavior: smooth;
        }
        
        .bg-gradient-primary {
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
        }
        
        .bg-gradient-secondary {
            background: linear-gradient(135deg, #718096 0%, #4a5568 100%);
        }
        
        .bg-gradient-success {
            background: linear-gradient(135deg, #68d391 0%, #38a169 100%);
        }
        
        .bg-gradient-warning {
            background: linear-gradient(135deg, #a0aec0 0%, #718096 100%);
        }
        
        .bg-gradient-dark {
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
        }
        
        .parallax {
            transform: translateZ(0);
            transition: transform 0.1s ease-out;
        }
        
        .project-overlay {
            background: linear-gradient(45deg, rgba(102, 126, 234, 0.9), rgba(118, 75, 162, 0.9));
            opacity: 0;
            transition: all 0.3s ease;
        }
        
        .project-card:hover .project-overlay {
            opacity: 1;
        }
        
        .skill-icon {
            transition: all 0.3s ease;
        }
        
        .skill-icon:hover {
            transform: scale(1.2) rotate(10deg);
        }
        
        .nav-link {
            position: relative;
            transition: all 0.3s ease;
        }
        
        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 50%;
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
            transition: all 0.3s ease;
        }
        
        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
            left: 0;
        }
        
        .timeline-item {
            position: relative;
        }
        
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -8px;
            top: 0;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
            box-shadow: 0 0 20px rgba(74, 85, 104, 0.3);
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: particleFloat 8s infinite linear;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        .morphing-blob {
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            animation: morph 8s ease-in-out infinite;
        }

        @keyframes morph {
            0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
            100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
        }

        .text-glow {
            text-shadow: 0 0 20px rgba(74, 85, 104, 0.3);
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .hover-lift {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hover-lift:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .scroll-reveal {
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.8s ease-out;
        }

        .scroll-reveal.revealed {
            opacity: 1;
            transform: translateY(0);
        }

        .magnetic-hover {
            transition: transform 0.3s ease;
        }

        .testimonial-card {
            background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
            border: 1px solid rgba(102, 126, 234, 0.1);
        }

        .service-icon {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .progress-ring {
            transform: rotate(-90deg);
        }

        .progress-ring-circle {
            stroke-dasharray: 251.2;
            stroke-dashoffset: 251.2;
            transition: stroke-dashoffset 2s ease-in-out;
        }

        .animated-bg {
            background: linear-gradient(-45deg, #4a5568, #2d3748, #718096, #a0aec0);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .neon-glow {
            box-shadow: 0 0 5px #4a5568, 0 0 10px #4a5568, 0 0 15px #4a5568, 0 0 20px #4a5568;
        }

        .cursor-trail {
            position: fixed;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(74, 85, 104, 0.6) 0%, transparent 70%);
            pointer-events: none;
            z-index: 9999;
            transition: all 0.1s ease;
        }
    </style>
</head>
<body class="scroll-smooth">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function Portfolio() {
            const [activeSection, setActiveSection] = useState('home');
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrollY, setScrollY] = useState(0);
            const [skillsVisible, setSkillsVisible] = useState(false);
            const [contactForm, setContactForm] = useState({ name: '', email: '', message: '' });
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [mousePosition, setMousePosition] = useState({ x: 0, y: 0 });
            const [cursorTrails, setCursorTrails] = useState([]);
            
            const skillsRef = useRef(null);
            const particlesRef = useRef([]);

            useEffect(() => {
                const handleScroll = () => {
                    setScrollY(window.scrollY);
                    
                    // Check if skills section is visible
                    if (skillsRef.current) {
                        const rect = skillsRef.current.getBoundingClientRect();
                        if (rect.top < window.innerHeight && rect.bottom > 0) {
                            setSkillsVisible(true);
                        }
                    }

                    // Reveal elements on scroll
                    const reveals = document.querySelectorAll('.scroll-reveal');
                    reveals.forEach(element => {
                        const elementTop = element.getBoundingClientRect().top;
                        const elementVisible = 150;
                        
                        if (elementTop < window.innerHeight - elementVisible) {
                            element.classList.add('revealed');
                        }
                    });
                };

                const handleMouseMove = (e) => {
                    setMousePosition({ x: e.clientX, y: e.clientY });
                    
                    // Create cursor trail effect
                    const newTrail = {
                        id: Date.now(),
                        x: e.clientX,
                        y: e.clientY
                    };
                    
                    setCursorTrails(prev => [...prev.slice(-5), newTrail]);
                };

                window.addEventListener('scroll', handleScroll);
                window.addEventListener('mousemove', handleMouseMove);
                
                // Create floating particles
                const createParticles = () => {
                    for (let i = 0; i < 20; i++) {
                        setTimeout(() => {
                            const particle = document.createElement('div');
                            particle.className = 'particle';
                            particle.style.left = Math.random() * 100 + '%';
                            particle.style.width = Math.random() * 4 + 2 + 'px';
                            particle.style.height = particle.style.width;
                            particle.style.background = `rgba(74, 85, 104, ${Math.random() * 0.4 + 0.1})`;
                            particle.style.animationDelay = Math.random() * 8 + 's';
                            particle.style.animationDuration = (Math.random() * 10 + 8) + 's';
                            
                            document.body.appendChild(particle);
                            
                            setTimeout(() => {
                                if (particle.parentNode) {
                                    particle.parentNode.removeChild(particle);
                                }
                            }, 18000);
                        }, i * 400);
                    }
                };

                createParticles();
                const particleInterval = setInterval(createParticles, 8000);

                return () => {
                    window.removeEventListener('scroll', handleScroll);
                    window.removeEventListener('mousemove', handleMouseMove);
                    clearInterval(particleInterval);
                };
            }, []);

            const scrollToSection = (sectionId) => {
                const element = document.getElementById(sectionId);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                    setActiveSection(sectionId);
                    setIsMenuOpen(false);
                }
            };

            const handleContactSubmit = (e) => {
                e.preventDefault();
                setIsSubmitted(true);
                setTimeout(() => {
                    setIsSubmitted(false);
                    setContactForm({ name: '', email: '', message: '' });
                }, 3000);
            };

                { name: 'Node.js', level: 88, icon: '🟢', color: 'bg-gray-600' },
                { name: 'Python', level: 82, icon: '🐍', color: 'bg-gray-500' },
                { name: 'CSS/Tailwind', level: 92, icon: '🎨', color: 'bg-gray-700' },
                { name: 'MongoDB', level: 80, icon: '🍃', color: 'bg-gray-600' },
                { name: 'AWS', level: 75, icon: '☁️', color: 'bg-gray-500' }
            ];

            const projects = [
                {
                    id: 1,
                    title: 'E-Commerce Platform',
                    description: 'Full-stack e-commerce solution with React, Node.js, and MongoDB. Features include user authentication, payment processing, and admin dashboard.',
                    image: '🛒',
                    tech: ['React', 'Node.js', 'MongoDB', 'Stripe'],
                    github: '#',

                },
                {

                    title: 'Task Management App',

                    image: '📋',
                    tech: ['React', 'Socket.io', 'Express', 'PostgreSQL'],

                    live: '#',

                },
                {

                    image: '🌤️',
                    tech: ['Vue.js', 'OpenWeather API', 'Chart.js'],
                    github: '#',
                    live: '#',
                    gradient: 'bg-gradient-success'
                },
                {
                    id: 4,

                    description: 'Analytics dashboard for social media metrics with data visualization, automated reporting, and performance insights.',
                    image: '📊',

                {

            const services = [

            return (
                <div className="min-h-full bg-gray-50 relative overflow-x-hidden">
                    {/* Cursor Trails */}
                    {cursorTrails.map((trail, index) => (
                        <div
                            key={trail.id}

                                    {['home', 'about', 'skills', 'services', 'projects', 'testimonials', 'contact'].map(section => (
                                        <button
                                            key={section}
                                            onClick={() => scrollToSection(section)}
                                            className={`nav-link px-3 py-2 text-sm font-medium transition-all duration-300 ${
                                                activeSection === section ? 'active text-gray-800' : 'text-gray-600 hover:text-gray-800'
                                            }`}
                                        >

                                        </button>
                                    ))}
                                </div>

                                {/* Mobile menu button */}
                                <div className="md:hidden">
                                    <button
                                        onClick={() => setIsMenuOpen(!isMenuOpen)}

                                    >
                                        <span className="text-2xl">{isMenuOpen ? '✕' : '☰'}</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Mobile Navigation */}
                        {isMenuOpen && (
                            <div className="md:hidden glass-effect border-t slide-in-right">
                                <div className="px-2 pt-2 pb-3 space-y-1">
                                    {['home', 'about', 'skills', 'services', 'projects', 'testimonials', 'contact'].map(section => (
                                        <button
                                            key={section}
                                            onClick={() => scrollToSection(section)}
                                            className="block px-3 py-2 text-base font-medium text-gray-600 hover:text-gray-800 hover:bg-gray-50 rounded-md transition-all duration-300 w-full text-left"

                        )}
                    </nav>

                    {/* Hero Section */}
                    <section id="home" className="min-h-screen flex items-center justify-center animated-bg text-white relative overflow-hidden">
                        <div

                            }}

                        {/* Floating geometric shapes */}

                        <div className="absolute top-1/2 left-20 w-12 h-12 morphing-blob bg-white/10 floating" style={{animationDelay: '4s'}}></div>

                                    I create beautiful, functional, and user-centered digital experiences that make a difference.

                                </p>
                                <div className="flex flex-col sm:flex-row gap-4 justify-center">
                                    <button
                                        onClick={() => scrollToSection('projects')}
                                        className="bg-white text-gray-800 px-8 py-4 rounded-full text-lg font-semibold hover:shadow-2xl transition-all duration-300 transform hover:scale-105 pulse-glow magnetic-hover"

                                    <button

                                        className="border-2 border-white text-white px-8 py-4 rounded-full text-lg font-semibold hover:bg-white hover:text-gray-800 transition-all duration-300 transform hover:scale-105 magnetic-hover"
